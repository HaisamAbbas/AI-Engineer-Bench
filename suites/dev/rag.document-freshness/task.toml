schema_version = "1.4"
artifacts = [{ source = "/workspace/submission", destination = "candidate" }]

[metadata]
kind = "aieb-mvp1-rag-document-freshness"
track = "track-a"
status = "development-only"

[agent]
timeout_sec = 120
network_mode = "no-network"

[verifier]
timeout_sec = 60
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
build_timeout_sec = 180
network_mode = "no-network"
cpus = 1
memory_mb = 512

[environment]
build_timeout_sec = 180
network_mode = "no-network"
cpus = 1
memory_mb = 512
workdir = "/workspace"
