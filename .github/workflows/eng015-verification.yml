name: ENG-015 lifecycle and migration gates
on:
  pull_request:
    paths:
      - "packages/aieb-runner/**"
      - "services/api/**"
      - "tests/test_attempt_lifecycle.py"
      - "tests/test_candidate_artifacts.py"
      - "tests/test_api_migrations.py"
      - "tests/test_worker_leasing.py"
      - "apps/web/**"
      - "scripts/seed_eng016_browser.py"
      - ".github/workflows/eng015-verification.yml"
  push:
    branches: [main]
jobs:
  unix-lifecycle-and-postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aieb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aieb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIEB_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aieb_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install website dependencies
        run: npm ci --prefix apps/web
      - name: Run website type, unit, and production build checks
        run: |
          npm --prefix apps/web run build
          npm --prefix apps/web test
      - run: uv sync --all-packages --locked
      - name: Create the real PostgreSQL schema
        run: uv run --directory services/api alembic upgrade head
      - name: Run lifecycle, worker, API, and real PostgreSQL migration regressions
        run: uv run python -m unittest tests.test_attempt_lifecycle tests.test_candidate_artifacts tests.test_worker_leasing tests.test_api_service tests.test_api_migrations tests.test_api_http_integration
      - name: Reset the schema to a clean state before seeding
        # The regression step above leaves rows behind (its tests truncate on
        # setUp, not teardown, and test_api_migrations/test_api_http_integration
        # seed their own fixtures), so the browser seed - which expects an empty
        # database - would otherwise collide on uq_task_revision_slug_version.
        # Recreate a clean schema on the same disposable database first.
        run: |
          uv run --directory services/api alembic downgrade base
          uv run --directory services/api alembic upgrade head
      - name: Seed published run for browser integration
        run: uv run python scripts/seed_eng016_browser.py
      - name: Run the API over HTTP
        run: uv run --directory services/api uvicorn aieb_api.app:app --host 127.0.0.1 --port 8015 > /tmp/aieb-api.log 2>&1 &
      - name: Start website against the live API
        run: VITE_API_BASE_URL=http://127.0.0.1:8015 npm --prefix apps/web run dev -- --host 127.0.0.1 --port 5173 > /tmp/aieb-web.log 2>&1 &
      - name: Check all pages in headless Chrome at desktop and mobile sizes
        env:
          AIEB_WEB_URL: http://127.0.0.1:5173
          VITE_API_BASE_URL: http://127.0.0.1:8015
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8015/openapi.json >/dev/null && curl --silent --fail http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node apps/web/scripts/browser-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eng016-browser-evidence
          path: .cache/eng016-browser/
          if-no-files-found: ignore
          retention-days: 14
