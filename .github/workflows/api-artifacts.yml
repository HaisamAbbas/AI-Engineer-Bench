name: API artifact staleness
on:
  pull_request:
    paths: ["services/api/**", "scripts/generate_openapi.py", "scripts/generate_typescript_client.py"]
  push:
    branches: [main]
jobs:
  check-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@b75a9098c1922b3195d3655f8f5fd8831a79c6e4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: uv sync --all-packages --locked
      - run: uv run python scripts/generate_openapi.py --check
      - run: uv run python scripts/generate_typescript_client.py --check
